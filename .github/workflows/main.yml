name: Build Theft4 Generic Renderer IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout Theft4
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Theft4 dependencies
        run: |
          python3 tools/setup_repo.py --check

      - name: Clone XeniOS
        run: |
          git clone --depth 1 --branch xenios https://github.com/xenios-jp/XeniOS.git ../XeniOS

      - name: Initialize XeniOS submodules
        run: |
          cd ../XeniOS
          git submodule sync --recursive
          git submodule update --init --recursive --depth 1

      - name: Fetch XeniOS data
        run: |
          cd ../XeniOS
          python3 xenia-build.py fetchdata

      - name: Configure XeniOS iOS
        run: |
          cd ../XeniOS

          cmake \
            -S . \
            -B build-ios-xcode \
            -G Xcode \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_SYSTEM_PROCESSOR=arm64 \
            -DCMAKE_OSX_SYSROOT=iphoneos \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_TRY_COMPILE_TARGET_TYPE=STATIC_LIBRARY \
            -DXENIA_ENABLE_IOS_MOLTENVK=ON \
            -DCMAKE_CONFIGURATION_TYPES="Checked;Debug;Release" \
            -DCMAKE_XCODE_GENERATE_SCHEME=ON

      - name: Build XeniOS iOS Release
        run: |
          cd ../XeniOS

          xcodebuild \
            -project build-ios-xcode/xenia.xcodeproj \
            -scheme xenia-app \
            -configuration Release \
            -destination "generic/platform=iOS" \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Find XeniOS libraries
        run: |
          echo "===== LIBRERIAS ENCONTRADAS ====="

          find ../XeniOS -type f \( \
            -name "libMoltenVK.a" -o \
            -name "libMoltenVK_ShaderConverter.a" -o \
            -name "libMoltenVK_Common.a" -o \
            -name "libspirv-cross.a" -o \
            -name "libSPIRV-Tools.a" \
          \) -print

      - name: Prepare Theft4 dependencies
        run: |
          mkdir -p ../XeniOS/build-ios-xcode/obj/iOS/Release

          find ../XeniOS -type f -name "libMoltenVK.a" \
            -exec cp {} ../XeniOS/build-ios-xcode/obj/iOS/Release/ \;

          find ../XeniOS -type f -name "libMoltenVK_ShaderConverter.a" \
            -exec cp {} ../XeniOS/build-ios-xcode/obj/iOS/Release/ \;

          find ../XeniOS -type f -name "libMoltenVK_Common.a" \
            -exec cp {} ../XeniOS/build-ios-xcode/obj/iOS/Release/ \;

          find ../XeniOS -type f -name "libspirv-cross.a" \
            -exec cp {} ../XeniOS/build-ios-xcode/obj/iOS/Release/ \;

          find ../XeniOS -type f -name "libSPIRV-Tools.a" \
            -exec cp {} ../XeniOS/build-ios-xcode/obj/iOS/Release/ \;

      - name: Check Theft4 dependencies
        run: |
          echo "===== COMPROBANDO LAS 5 LIBRERIAS ====="

          test -f ../XeniOS/build-ios-xcode/obj/iOS/Release/libMoltenVK.a
          test -f ../XeniOS/build-ios-xcode/obj/iOS/Release/libMoltenVK_ShaderConverter.a
          test -f ../XeniOS/build-ios-xcode/obj/iOS/Release/libMoltenVK_Common.a
          test -f ../XeniOS/build-ios-xcode/obj/iOS/Release/libspirv-cross.a
          test -f ../XeniOS/build-ios-xcode/obj/iOS/Release/libSPIRV-Tools.a

          echo "===== LAS 5 LIBRERIAS ESTAN ====="
          ls -lh ../XeniOS/build-ios-xcode/obj/iOS/Release/

      - name: Build Theft4 IPA
        run: |
          chmod +x tools/build_ios_release.sh
          ./tools/build_ios_release.sh

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Theft4-generic-renderer
          path: dist/*.ipa

      - name: Upload SHA256
        uses: actions/upload-artifact@v4
        with:
          name: Theft4-generic-renderer-sha256
          path: dist/*.sha256
